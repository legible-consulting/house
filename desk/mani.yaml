# Hand-written (desk/CONTEXT.md). Every client build, and Jamie's own repos the blueprint
# governs (jamienisbet, adopted 2026-10-22). tags: live (a build the blueprint governs, checked
# against the blueprint tag), dormant (archived, nothing changes in it). Jamie's other projects
# on k0d0minio, which the blueprint does not govern, are not estate and are not listed
# (2026-10-21). vercel: the Vercel team that holds the repo's projects; neon: the Neon
# organisation that holds its database projects, a label or an `org-…` id. Each one names the
# token that conformance/drift.sh reads from the shell: VERCEL_TOKEN_<TEAM>, NEON_API_KEY_<ORG>
# (conformance/CONTEXT.md, 2026-10-29).
