<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · Desk</title>
    <style>
      /* Served from the service worker's cache (public/sw.js) with no stylesheet and no
         font, so the colours are the brand's paper and ink as literals and the face is the
         system's. Light: text #1E1E1E on #FFFEFA (16.52:1), meta #6F6E6A (5.06:1). Dark:
         text #FFFEFA on #1E1E1E (16.52:1), meta #9D9C97 (6.06:1). */
      :root {
        color-scheme: light dark;
        --canvas: #fffefa;
        --text: #1e1e1e;
        --meta: #6f6e6a;
        --tint: #1e1e1e;
        --on-tint: #fffefa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #1e1e1e;
          --text: #fffefa;
          --meta: #9d9c97;
          --tint: #fffefa;
          --on-tint: #1e1e1e;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: calc(1.5rem + env(safe-area-inset-top)) 1rem calc(1.5rem + env(safe-area-inset-bottom));
        background: var(--canvas);
        color: var(--text);
        font: 400 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 24rem;
      }
      svg {
        display: block;
        width: 2.25rem;
        height: 2.25rem;
        margin-bottom: 1.5rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.375rem;
        line-height: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--meta);
      }
      button {
        min-height: 2.75rem;
        padding: 0 1rem;
        border: 0;
        border-radius: 6px;
        background: var(--tint);
        color: var(--on-tint);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover,
      button:active {
        opacity: 0.85;
      }
      button:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: -2px;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- The JN mark: the brand's traced paths, copied from components/desk/logo.tsx. -->
      <svg viewBox="0 0 100 100" role="img" aria-label="Jamie Nisbet">
        <path d="M0 0H100V100H0ZM2.09 2.09V97.91H97.91V2.09Z" fill-rule="evenodd" fill="currentColor" />
        <path
          d="M22.02 79.92C21.36 79.88 20.42 79.76 19.63 79.60C16.84 79.03 14.43 77.83 12.07 75.83C11.44 75.29 9.92 73.75 9.40 73.10L9.01 72.62L9.92 71.72C10.42 71.22 11.89 69.76 13.19 68.48L15.56 66.14L16.43 67.01C18.30 68.86 19.23 69.60 20.28 70.04C21.19 70.42 22.44 70.61 23.20 70.47C24.49 70.24 25.47 69.21 25.85 67.70C26.15 66.51 26.14 67.27 26.16 47.13L26.18 28.03L30.99 28.03L35.80 28.03L35.78 47.46C35.76 65.64 35.75 66.96 35.64 67.81C35.18 71.48 34.25 74.03 32.62 76.13C30.51 78.85 26.87 80.15 22.02 79.92ZM43.85 53.37L43.85 28.03L48.48 28.03L53.11 28.03L61.35 40.65C65.89 47.60 70.76 55.05 72.18 57.23L74.77 61.18L74.79 44.60L74.80 28.03L79.65 28.03L84.49 28.03L84.49 53.37L84.49 78.72L79.85 78.72L75.20 78.72L75.05 78.50C74.96 78.39 70.09 70.93 64.23 61.94L53.57 45.59L53.53 62.14L53.50 78.68L48.67 78.70L43.85 78.72L43.85 53.37Z"
          fill="currentColor"
        />
      </svg>
      <h1>You are offline</h1>
      <p>Every page is read live from the house, so the desk needs the network.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
