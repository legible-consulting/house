hours:
  total:                        # not measured (Jamie, 2026-10-23)
  per_month:                    # not measured. The key the desk reads

costs_monthly:                  # not measured (Jamie, 2026-10-23). Jamie pays Vercel, Neon, Resend and Sentry inside the commission. The client owes nothing for them
  model:
  hosting:
  other:

margin:                         # not computed. Hours and costs are not measured

precedent: "none. The first build. Agreed before the house existed."

deviation: "below the anchor. 2,000 for work the proposal values at 5,900, in exchange for the commission on bookings. Agreed 2026-07-23, before core/services.md existed. The next build quote reads it as precedent."
