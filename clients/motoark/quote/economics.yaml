# MotoArk retainer: the engagement's own economics. Internal. Written by S4 on 2026-10-22 from
# Jamie's answers of 2026-10-21. Updated 2026-10-23 to what Jamie said on the follow-up call.
# A value marked estimate is replaced by the monthly close.
client: motoark
kind: retainer
date: 2026-10-23
currency: EUR

price:
  monthly: 3700                 # the price the desk reads: proposed now, agreed from stage agreement. The paid-monthly structure
  anchor_hourly: 120            # core/services.md, internal, never a billing basis
  rule_standard_monthly: 7200   # hours.per_month × anchor_hourly (core/services.md § Retainer pricing)
  rule_block_monthly: 6120      # the rule less 15% for a 3-month block
  standard_monthly: 3800        # from month 4, against a written monthly scope; below the rule (quote/negotiation.md § Deviations). Not said on 2026-10-23; open (§ Open)
  evaluation_monthly: 3700      # months 1 to 3, paid monthly, as said on 2026-10-23
  evaluation_split: [3500, 3500, 3700]   # the two-halves structure, as said on 2026-10-23: two invoices of 5350
  evaluation_months: 3
  evaluation_total: 11100       # paid monthly
  evaluation_total_split: 10700 # two halves
  discount_vs_standard: 0.026   # 1 - 3700 / 3800

hours:
  per_month: 60                 # promised in the quote (2026-10-22). Jamie said 40 to 60 on 2026-10-23; the quote keeps 60 unless Jamie changes it (quote/negotiation.md § Open)
  beyond_promise: billed at anchor_hourly   # agreed with the client first, on the next invoice; the quote says so (Jamie, 2026-10-22)
  effective_hourly: 61.67       # evaluation_monthly / per_month
  effective_vs_anchor: 0.51     # effective_hourly / anchor_hourly

costs_monthly:
  model: 300                    # estimate, not measured: the share of Claude usage this retainer takes
  hosting: 0                    # client-owned: MotoArk's Azure and accounts (core/terms.md § Hosting and support)
  other: 0

margin_monthly: 3400            # evaluation_monthly - costs_monthly
margin_ratio: 0.92              # margin_monthly / evaluation_monthly

precedent:
  sustentus: 3890 a month, month to month, full-time expected (clients/sustentus/quote/economics.yaml).

closes_open_item: none. The retainer price range closed in core/services.md § Retainer pricing on 2026-10-22. This quote sits below the rule (quote/negotiation.md § Deviations).
