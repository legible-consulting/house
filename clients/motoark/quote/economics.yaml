# MotoArk retainer: the engagement's own economics. Internal. Written by S4 on 2026-10-22 from
# Jamie's answers of 2026-10-21. A value marked estimate is replaced by the monthly close.
client: motoark
kind: retainer
date: 2026-10-22
currency: EUR

price:
  monthly: 3500                 # the price the desk reads: proposed now, agreed from stage agreement
  anchor_hourly: 120            # core/services.md, internal, never a billing basis
  rule_standard_monthly: 7200   # hours.per_month × anchor_hourly (core/services.md § Retainer pricing)
  rule_block_monthly: 6120      # the rule less 15% for a 3-month block
  standard_monthly: 3800        # from month 4, against a written monthly scope; below the rule (quote/negotiation.md § Deviations)
  evaluation_monthly: 3500      # months 1 to 3, the committed block
  evaluation_months: 3
  evaluation_total: 10500
  discount_vs_standard: 0.079   # 1 - 3500 / 3800

hours:
  per_month: 60                 # Jamie's estimate, 2026-10-21: about 15 hours a week of his own attention; the sessions run the rest
  effective_hourly: 58.33       # evaluation_monthly / per_month
  effective_vs_anchor: 0.49     # effective_hourly / anchor_hourly

costs_monthly:
  model: 300                    # estimate, not measured: the share of Claude usage this retainer takes
  hosting: 0                    # client-owned: MotoArk's Azure and accounts (core/terms.md § Hosting and support)
  other: 0

margin_monthly: 3200            # evaluation_monthly - costs_monthly
margin_ratio: 0.91              # margin_monthly / evaluation_monthly

precedent:
  sustentus: 3890 a month, month to month, full-time expected (clients/sustentus/quote/economics.yaml).

closes_open_item: none. The retainer price range closed in core/services.md § Retainer pricing on 2026-10-22. This quote sits below the rule (quote/negotiation.md § Deviations).
