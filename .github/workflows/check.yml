# check: what can go wrong in the house today, checked where it is pushed (CI is truth;
# never run locally).
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    # Private repos on GitHub Free get no secret scanning; this is the guard. The binary,
    # not gitleaks-action: the action needs a paid licence on organisation accounts.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "${f}" gitleaks
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner -v .

  contracts:
    # Every stage contract keeps the ICM shape: Inputs, Process, Outputs. Its frontmatter says
    # `status: stub | built`, and a built contract has no placeholder line (core/lexicon.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Contract sections
        run: |
          fail=0
          while IFS= read -r f; do
            for s in Inputs Process Outputs; do
              grep -qx "## ${s}" "$f" || { echo "::error file=${f}::missing '## ${s}'"; fail=1; }
            done
          done < <(git ls-files '*CONTEXT.md')
          exit "$fail"
      - name: Contract status
        run: |
          yq --version | grep -q mikefarah || { echo "::error::runner yq is not mikefarah's"; exit 1; }
          fail=0
          while IFS= read -r f; do
            s="$(yq --front-matter=extract '.status // ""' "$f" 2>/dev/null)" || s=""
            if [ "$s" != stub ] && [ "$s" != built ]; then
              echo "::error file=${f}::frontmatter 'status' must be 'stub' or 'built'"; fail=1
            elif [ "$s" = built ] && grep -qF 'Defined when the module is built' "$f"; then
              echo "::error file=${f}::status is 'built' but Process keeps the placeholder line"; fail=1
            fi
          done < <(git ls-files '*CONTEXT.md')
          exit "$fail"

  frontmatter:
    # Frontmatter is what the desk, the manifest and the dashboard read; it must parse.
    # clients/_template/ is skipped: its {{PLACEHOLDERS}} are filled at first touch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse every frontmatter block
        run: |
          yq --version | grep -q mikefarah || { echo "::error::runner yq is not mikefarah's"; exit 1; }
          fail=0
          while IFS= read -r f; do
            [ "$(head -n1 "$f")" = "---" ] || continue
            yq --front-matter=extract '.' "$f" >/dev/null 2>err.txt \
              || { echo "::error file=${f}::frontmatter does not parse: $(head -n1 err.txt)"; fail=1; }
          done < <(git ls-files '*.md' ':!:clients/_template/*')
          exit "$fail"

  placement:
    # Every tracked file has a home: a contract's `holds:` globs, or the repo's own
    # infrastructure. A file nobody holds is clutter (house rule, 2026-10-19).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every file is held by a contract
        run: |
          yq --version | grep -q mikefarah || { echo "::error::runner yq is not mikefarah's"; exit 1; }
          held="$(mktemp)"
          git ls-files -- ':(glob)CLAUDE.md' ':(glob)README.md' ':(glob).gitignore' ':(glob).gitleaksignore' \
            ':(glob).github/**' ':(glob).claude/**' ':(glob)**/CONTEXT.md' >> "$held"
          while IFS= read -r c; do
            [ "$(head -n1 "$c")" = "---" ] || continue
            dir="$(dirname "$c")"
            while IFS= read -r g; do
              [ -n "$g" ] || continue
              if [ "$dir" = "." ]; then p="$g"; else p="$dir/$g"; fi
              git ls-files -- ":(glob)$p" >> "$held"
            done < <(yq --front-matter=extract '.holds // [] | .[]' "$c")
          done < <(git ls-files '*CONTEXT.md')
          orphans="$(comm -23 <(git ls-files | sort -u) <(sort -u "$held"))"
          [ -z "$orphans" ] && exit 0
          while IFS= read -r f; do echo "::error file=${f}::no contract holds this file"; done <<< "$orphans"
          exit 1

  writing:
    # Simplified Technical English as advice: the linter's findings go to the run summary and
    # never fail the run (house: technical text is STE-flavored, 2026-10-19). The skill is
    # pinned to the commit the local clone is at (core/stack.md).
    runs-on: ubuntu-latest
    env:
      STE_SKILL_SHA: 3944283c183eea13fe5bd902b572da3b4de8bf44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the linter at its pinned commit
        run: |
          git clone -q https://github.com/danyuchn/asd-ste100-skill /tmp/ste
          git -C /tmp/ste checkout -q "$STE_SKILL_SHA"
      - name: Lint every markdown file, as advice
        run: |
          out="$(git ls-files -z '*.md' ':!:clients/_template/*' | xargs -0 python3 -I /tmp/ste/scripts/ste-lint.py 2>&1 || true)"
          { echo '## Simplified Technical English (advice)'; echo; echo '```'; echo "$out" | tail -n 200; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$out" | tail -n 40

  guards:
    # The house and the blueprint's site tier ship the same guards. A copy that drifts leaves
    # one of them unguarded (core/stack.md, 2026-10-19). Compared against blueprint main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the blueprint's copies
        run: git clone -q --depth 1 https://github.com/legible-consulting/blueprint /tmp/blueprint
      - name: Same bytes as the blueprint
        run: |
          fail=0
          for f in .claude/hooks/*.sh; do
            cmp -s "$f" "/tmp/blueprint/templates/site/$f" \
              || { echo "::error file=${f}::differs from blueprint templates/site/${f}"; fail=1; }
          done
          exit "$fail"

  scripts:
    # The setup scripts and the hook run on machines with no other guard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=warning
