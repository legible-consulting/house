# dashboard: build desk/app and deploy it to production on Vercel (CI is truth; never build
# locally). Production, not a preview, since 2026-10-19: the app carries its own sign-in and
# roles (desk/CONTEXT.md), so the page no longer needs Vercel Authentication in front of it,
# and a preview URL behind Vercel Authentication keeps the salesmen out. The 6-hour schedule
# went with the preview: clients/ changes reach main by push, and the pool lives in Neon.
# `vercel pull` writes the project's production settings and variables for `vercel build`;
# `vercel deploy --prebuilt` uploads that build output as is.
name: dashboard

on:
  push:
    branches: [main]
    paths:
      - "clients/**"
      - "desk/app/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desk/app
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desk/app/package-lock.json
      - name: Install
        run: npm ci
      - name: Pull the project's production settings
        run: npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Build
        run: npx vercel build --prod --token "$VERCEL_TOKEN"
      - name: Deploy to production
        run: |
          url="$(npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")"
          echo "Dashboard: ${url}" >> "$GITHUB_STEP_SUMMARY"
