# dashboard: build desk/app from clients/ and deploy it to Vercel (CI is truth; never build
# locally). Preview deploys only: a preview sits behind Vercel Authentication, a production
# domain is public, and the page names clients (Jamie, 2026-10-16).
name: dashboard

on:
  push:
    branches: [main]
    paths:
      - "clients/**"
      - "desk/app/**"
      - ".github/workflows/dashboard.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desk/app
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desk/app/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy a preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(npx vercel deploy dist --yes --token "$VERCEL_TOKEN")"
          echo "Dashboard: ${url}" >> "$GITHUB_STEP_SUMMARY"
